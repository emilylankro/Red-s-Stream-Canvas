name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/Release/RedsStreamCanvas.exe -DestinationPath RedsStreamCanvas-Alpha-0.2-windows-x64.zip -Force

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: RedsStreamCanvas-windows-x64
          path: build/Release/RedsStreamCanvas.exe

      - name: Publish Alpha 0.2 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish Alpha 0.2')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-alpha `
            RedsStreamCanvas-Alpha-0.2-windows-x64.zip `
            --target $env:GITHUB_SHA `
            --title "Red's Stream Canvas Alpha 0.2" `
            --notes-file RELEASE_NOTES.md `
            --prerelease
